<a
  [routerLink]="['/skills', skill().id]"
  class="group flex flex-col gap-3 rounded-xl border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md"
>
  <div class="flex items-start justify-between gap-2">
    <h3 class="text-lg font-semibold text-slate-900 group-hover:text-indigo-600">
      {{ skill().name }}
    </h3>
    <span
      class="shrink-0 rounded-full px-2.5 py-0.5 text-xs font-medium"
      [class]="categoryColor(skill().category)"
    >
      {{ skill().category }}
    </span>
  </div>

  <p class="line-clamp-3 text-sm text-slate-600">{{ skill().purpose }}</p>

  <code class="text-xs text-slate-400">.claude/skills/{{ skill().slug }}/SKILL.md</code>

  <div class="mt-auto flex flex-wrap gap-1.5 pt-2">
    @for (tag of skill().techTags; track tag) {
      <span class="rounded-md bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-500">
        {{ tag }}
      </span>
    }
  </div>
</a>
